<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Primeiros Socorros na Escola – Realidade Aumentada</title>
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
<style>
:root{--bg:#0f2230;--ac:#2ec4b6;--rd:#e63946;--tx:#fff}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;color:var(--tx)}
#ui{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
#top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:linear-gradient(#000a,transparent)}
#top b{font-size:15px}
#top a{pointer-events:auto;color:#fff;text-decoration:none;font-size:13px;background:#0008;padding:6px 12px;border-radius:16px}
#hint{align-self:center;background:#000a;padding:8px 16px;border-radius:20px;font-size:14px;margin-bottom:8px}
#bottom{pointer-events:auto}
#panel{display:none;background:var(--bg);max-height:52vh;overflow:auto;padding:16px;border-radius:16px 16px 0 0;font-size:15px;line-height:1.5}
#panel.open{display:block}
#panel h2{margin:0 0 8px;font-size:18px;color:var(--ac)}
#panel h3{margin:14px 0 4px;font-size:15px}
#panel ul{margin:4px 0;padding-left:20px}
.no{color:#ff8a93}.ok{color:#7ee2a8}
.card{background:#ffffff14;border-radius:10px;padding:10px 12px;margin:8px 0}
.tel{background:var(--rd);border-radius:8px;padding:8px 12px;margin:10px 0;font-weight:600}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px;border:1px solid #fff4;border-radius:10px;background:#ffffff10;color:#fff;font-size:15px}
.opt.right{background:#1f8a5b}.opt.wrong{background:#a12b36}
.fb{margin:6px 0 12px;font-size:14px}
small{opacity:.7;display:block;margin-top:12px}
#tabs{display:flex;background:#081620}
#tabs button{flex:1;padding:12px 4px;border:0;background:none;color:#fff9;font-size:12px}
#tabs button.on{color:var(--ac);border-top:3px solid var(--ac)}
#tabs b{display:block;font-size:15px}
</style>
</head>
<body>

<a-scene embedded vr-mode-ui="enabled: false"
         arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; trackingMethod: best;">
  <!-- Troque marcador.patt pelo arquivo do seu marcador -->
  <a-marker type="pattern" url="marcador.patt" smooth="true" smoothCount="10">
    <!-- Sistema respiratório (modelo simples). Para usar um modelo profissional:
         <a-entity gltf-model="pulmoes.glb" rotation="-90 0 0" scale="1 1 1"></a-entity> -->
    <a-entity rotation="-90 0 0" scale="1.4 1.4 1.4">
      <a-cylinder radius="0.07" height="0.7" position="0 0.55 0" color="#9fc7e8"></a-cylinder>
      <a-cylinder radius="0.05" height="0.38" position="-0.1 0.12 0" rotation="0 0 -35" color="#9fc7e8"></a-cylinder>
      <a-cylinder radius="0.05" height="0.38" position="0.1 0.12 0" rotation="0 0 35" color="#9fc7e8"></a-cylinder>
      <a-entity position="0 -0.15 0"
        animation="property: scale; from: 1 1 1; to: 1.15 1.12 1.15; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine">
        <a-sphere radius="0.3" scale="0.8 1.3 0.6" position="-0.3 0 0" color="#e8878f"></a-sphere>
        <a-sphere radius="0.3" scale="0.8 1.3 0.6" position="0.3 0 0" color="#e8878f"></a-sphere>
      </a-entity>
      <a-cylinder radius="0.58" height="0.03" position="0 -0.62 0" color="#c0504d"
        animation="property: position; from: 0 -0.6 0; to: 0 -0.7 0; dir: alternate; dur: 2500; loop: true; easing: easeInOutSine"></a-cylinder>
      <a-text value="Traqueia" position="0.14 0.8 0.05" width="1.6" color="#ffe66d" align="left"></a-text>
      <a-text value="Brônquios" position="0.3 0.2 0.05" width="1.6" color="#ffe66d" align="left"></a-text>
      <a-text value="Pulmões" position="0.62 -0.1 0.2" width="1.6" color="#ffe66d" align="left"></a-text>
      <a-text value="Diafragma" position="0.62 -0.66 0.05" width="1.6" color="#ffe66d" align="left"></a-text>
    </a-entity>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>

<div id="ui">
  <div id="top"><b>Primeiros Socorros na Escola</b><a href="../#ar">← Site</a></div>
  <div id="hint">Aponte a câmera para o banner</div>
  <div id="bottom">
    <div id="panel"></div>
    <div id="tabs">
      <button data-k="corpo"><b>01</b>Corpo</button>
      <button data-k="agir"><b>02</b>Agir</button>
      <button data-k="quiz"><b>03</b>Quiz</button>
      <button data-k="lei"><b>04</b>Lei Lucas</button>
    </div>
  </div>
</div>

<script>
const AVISO = '<small>Conteúdo educativo. Não substitui curso de primeiros socorros com profissional de saúde. Em emergência, ligue <b>192 (SAMU)</b>.</small>';
const SEC = {
corpo: () => `<h2>Conheça o corpo humano</h2>
<p>O ar entra pelo nariz e pela boca, desce pela <b>traqueia</b>, passa pelos <b>brônquios</b> e chega aos <b>pulmões</b>. O <b>diafragma</b> desce para o ar entrar (inspiração) e sobe para o ar sair (expiração) — veja o movimento no modelo 3D.</p>
<div class="card"><b>E no engasgo?</b> Um objeto bloqueia a passagem do ar nas vias aéreas. Se o bloqueio é total, o ar não chega aos pulmões e é preciso agir rápido.</div>${AVISO}`,

agir: () => `<h2>Aprenda a agir</h2>
<div class="tel">Dúvida ou gravidade? Ligue 192 (SAMU).</div>
<div class="card"><h3>🫁 Engasgo</h3>
<b>Parcial:</b> a criança tosse, chora ou fala. Incentive a tossir e acompanhe. Não dê tapas nem tente tirar com o dedo.<br>
<b>Grave:</b> não tosse, não emite som, leva a mão ao pescoço, pode ficar arroxeada. Peça ajuda, ligue 192 e aplique a manobra:
<ul><li><b>Maior de 1 ano:</b> compressões abdominais (Heimlich).</li><li><b>Bebê (menos de 1 ano):</b> 5 tapas nas costas alternados com 5 compressões no peito.</li><li>Se desmaiar, inicie a RCP e continue até a chegada do socorro.</li></ul></div>
<div class="card"><h3>🤕 Queda</h3>
<ul><li>Veja se o local é seguro e avalie a criança com calma.</li><li><b>Dor no pescoço/costas, pancada forte na cabeça, desmaio, vômitos ou sonolência:</b> não movimente e ligue 192.</li><li class="no">Não levante, não peça para andar, não ofereça água ou comida.</li></ul></div>
<div class="card"><h3>⚡ Convulsão</h3>
<ul><li>Anote a hora e afaste objetos perigosos.</li><li>Proteja a cabeça com algo macio e afrouxe a roupa.</li><li>Quando passar, deite de lado e fique ao lado.</li><li class="no">Não segure os movimentos e não coloque nada na boca.</li><li>Ligue 192 se durar mais de 5 minutos, se for a primeira crise, se repetir ou se houver dificuldade para respirar.</li></ul></div>
<div class="card"><h3>🔥 Queimadura</h3>
<ul><li>Afaste do calor e resfrie com <b>água corrente</b> por vários minutos.</li><li>Cubra com pano limpo e não estoure bolhas.</li><li class="no">Não use pasta de dente, manteiga, café ou outras receitas caseiras.</li><li>Procure atendimento se for extensa, no rosto, mãos ou genitais, ou se for elétrica/química.</li></ul></div>
<div class="card"><h3>🧰 Kit de primeiros socorros</h3>
Luvas descartáveis, gaze, ataduras, soro fisiológico, curativos, esparadrapo e tesoura sem ponta.
<div class="no">Sem orientação profissional: evite pomadas, medicamentos, álcool ou água oxigenada em ferimentos.</div></div>${AVISO}`,

lei: () => `<h2>Lei Lucas (Lei nº 13.722/2018)</h2>
<div class="card"><b>O que é:</b> lei federal sancionada em 4 de outubro de 2018 que torna obrigatória a capacitação em noções básicas de primeiros socorros de professores e funcionários de escolas públicas e privadas de educação básica e de recreação infantil.</div>
<div class="card"><b>Por que foi criada:</b> em homenagem a Lucas Begalli Zamora, de 10 anos, que morreu em 2017 por obstrução das vias aéreas durante um passeio escolar, sem ninguém capacitado para socorrê-lo.</div>
<div class="card"><b>O que a escola precisa fazer:</b>
<ul><li>Oferecer a capacitação todos os anos, com reciclagem.</li><li>Manter kit de primeiros socorros.</li><li>Exibir em local visível a certificação de conformidade.</li></ul></div>
<div class="card"><b>Por que importa:</b> quem primeiro presencia o acidente é o professor. Saber reconhecer a emergência e agir até o socorro chegar pode salvar vidas.</div>`
};

const Q = [
 {q:'Uma criança começa a ter uma convulsão durante a aula. O que fazer?',o:['Segurar os braços e as pernas.','Colocar um objeto na boca.','Afastar objetos perigosos e proteger a cabeça.'],r:2,e:'Não se deve conter os movimentos nem colocar nada na boca. Proteja a cabeça e marque o tempo.'},
 {q:'Uma criança cai e reclama de muita dor no pescoço. O que fazer?',o:['Levantar a criança imediatamente.','Evitar movimentá-la e acionar ajuda.','Pedir que ela caminhe.'],r:1,e:'Dor no pescoço pode indicar lesão na coluna. Não movimente e ligue 192.'},
 {q:'Uma criança sofre uma queimadura. Qual é a primeira medida adequada?',o:['Passar pasta de dente.','Colocar manteiga.','Resfriar a região com água corrente.'],r:2,e:'Água corrente resfria a pele. Receitas caseiras pioram a lesão e aumentam o risco de infecção.'}
];
let qi=0,score=0;
SEC.quiz = () => {
  if(qi>=Q.length){const s=score;return `<h2>Resultado</h2><p>Você acertou <b>${s} de ${Q.length}</b>.</p><button class="opt" onclick="qi=0;score=0;show('quiz')">Refazer</button>${AVISO}`}
  const x=Q[qi];
  return `<h2>O que você faria? (${qi+1}/${Q.length})</h2><p>${x.q}</p>`+
    x.o.map((t,i)=>`<button class="opt" onclick="ans(${i},this)">${'ABC'[i]}) ${t}</button>`).join('')+'<div class="fb" id="fb"></div>';
};
function ans(i,b){
  const x=Q[qi],bs=document.querySelectorAll('.opt');
  bs.forEach((e,k)=>{e.disabled=true;if(k===x.r)e.classList.add('right')});
  if(i===x.r)score++;else b.classList.add('wrong');
  document.getElementById('fb').innerHTML=(i===x.r?'<b class="ok">Correto!</b> ':'<b class="no">Não foi essa.</b> ')+x.e+
    `<br><button class="opt" style="text-align:center" onclick="qi++;show('quiz')">${qi<Q.length-1?'Próxima':'Ver resultado'}</button>`;
}

const panel=document.getElementById('panel'),tabs=[...document.querySelectorAll('#tabs button')];
let cur=null;
function show(k){cur=k;panel.innerHTML=SEC[k]();panel.classList.add('open');panel.scrollTop=0;tabs.forEach(t=>t.classList.toggle('on',t.dataset.k===k))}
tabs.forEach(t=>t.onclick=()=>{if(cur===t.dataset.k){panel.classList.remove('open');t.classList.remove('on');cur=null}else show(t.dataset.k)});

const m=document.querySelector('a-marker'),hint=document.getElementById('hint');
m.addEventListener('markerFound',()=>hint.style.display='none');
m.addEventListener('markerLost',()=>hint.style.display='block');
</script>
</body>
</html>
